name: Deploy frontend to GitHub Pages

on:
  # Publica sempre que o frontend (docs/) ou este workflow mudar na branch main.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # Também pode ser disparado manualmente em Actions > Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; uma nova publicação cancela a que ainda não terminou.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        working-directory: backend
        run: npm ci
      # Inclui a verificação de que nenhum segredo está no frontend e os testes do cálculo de progresso.
      - name: Rodar testes
        working-directory: backend
        run: npm test

  deploy:
    name: Publicar docs/
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
