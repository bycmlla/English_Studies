<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My English Journey</title>
    <meta name="description" content="Meu painel de estudos de inglês: acompanhe o progresso nos livros Interchange Fifth Edition." />
    <meta name="theme-color" content="#fbfbfa" />
    <meta name="robots" content="noindex" />
    <!--
      Política de segurança de conteúdo: só scripts/estilos do próprio site e conexões para a API.
      Se usar um domínio próprio na API (diferente de *.onrender.com), inclua-o em connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.onrender.com http://localhost:3000 http://127.0.0.1:3000; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme-init.js"></script>
    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div id="app">
      <main id="main" class="center-screen">
        <div class="spinner" aria-hidden="true"></div>
        <p role="status">Carregando…</p>
        <noscript><p>Este site precisa de JavaScript para funcionar.</p></noscript>
      </main>
    </div>
  </body>
</html>
